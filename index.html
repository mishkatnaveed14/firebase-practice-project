<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Auth Modal</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Main Screen Trigger Button -->
    <button class="open-modal-btn" id="openModal">Account Login</button>

    <!-- Modal Container Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="auth-modal">

            <!-- Close Button -->
            <button class="close-btn" id="closeModal" aria-label="Close modal">✕</button>

            <!-- Tab Switchers -->
            <div class="tab-header">
                <button class="tab-btn active" id="btnSigninTab">Sign In</button>
                <button class="tab-btn" id="btnSignupTab">Sign Up</button>
            </div>

            <!-- Header Info -->
            <div class="modal-header">
                <h2 id="modalTitle">Welcome Back</h2>
                <p id="modalSubtitle">Please enter your details to continue</p>
            </div>

            <!-- Social Login Options -->
            <div class="social-buttons">
                <button class="btn-social" type="button" aria-label="Google">
                    <svg viewBox="0 0 24 24">
                        <path fill="#EA4335"
                            d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z" />
                        <path fill="#4285F4"
                            d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z" />
                        <path fill="#FBBC05"
                            d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9c-.4-.7-.6-1.5-.6-2.3z" />
                        <path fill="#34A853"
                            d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z" />
                    </svg>
                </button>
                <button class="btn-social" type="button" aria-label="GitHub">
                    <svg viewBox="0 0 24 24" fill="#ffffff">
                        <path
                            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                    </svg>
                </button>
                <button class="btn-social" type="button" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" fill="#1877F2">
                        <path
                            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                    </svg>
                </button>
            </div>

            <div class="divider">
                <span>or continue with email</span>
            </div>

            <!-- Sign In Form -->
            <form class="form-content active" id="formSignin">
                <div class="form-group">
                    <label for="signin-email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="signin-email" placeholder="name@company.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signin-password" class="password-input" placeholder="••••••••"
                            required>
                        <button type="button" class="toggle-password">👁️</button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <button type="submit" class="btn-submit" id="signin-btn">Sign In</button>
            </form>

            <!-- Sign Up Form -->
            <form class="form-content" id="formSignup">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="signup-name" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="signup-email" placeholder="name@company.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signup-password" class="password-input" placeholder="••••••••"
                            required>
                        <button type="button" class="toggle-password">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="signup-btn">Create Account</button>
            </form>
            <button id="getsingledata" class="btn-submit">Get data</button>
        </div>
    </div>

    <!-- Pure UI Javascript -->
    <script>
        // DOM Elements
        const modalOverlay = document.getElementById('modalOverlay');
        const openModalBtn = document.getElementById('openModal');
        const closeModalBtn = document.getElementById('closeModal');

        const btnSigninTab = document.getElementById('btnSigninTab');
        const btnSignupTab = document.getElementById('btnSignupTab');
        const formSignin = document.getElementById('formSignin');
        const formSignup = document.getElementById('formSignup');

        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');

        // 1. Open / Close Modal Logic
        openModalBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        // Close when clicking outside the card
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // 2. Tab Switching Logic (UI Only)
        btnSigninTab.addEventListener('click', () => {
            btnSigninTab.classList.add('active');
            btnSignupTab.classList.remove('active');

            formSignin.classList.add('active');
            formSignup.classList.remove('active');

            modalTitle.textContent = "Welcome Back";
            modalSubtitle.textContent = "Please enter your details to continue";
        });

        btnSignupTab.addEventListener('click', () => {
            btnSignupTab.classList.add('active');
            btnSigninTab.classList.remove('active');

            formSignup.classList.add('active');
            formSignin.classList.remove('active');

            modalTitle.textContent = "Create Account";
            modalSubtitle.textContent = "Join us to get started with your account";
        });

        // 3. Password Show/Hide Feature (UI Only)
        const togglePasswordBtns = document.querySelectorAll('.toggle-password');
        togglePasswordBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const input = btn.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    btn.textContent = '🙈';
                } else {
                    input.type = 'password';
                    btn.textContent = '👁️';
                }
            });
        });
    </script>
    <script type="module" src="index.js"></script>
</body>

</html>
