<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - LearnHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dash-header">
  <h2>LearnHub <span class="badge">Admin Panel</span></h2>
  <button class="btn logout-btn" onclick="handleLogout()">Logout</button>
</div>

<div class="dash-body">
  <h1>Welcome, <span id="welcomeName">Admin</span> 👑</h1>
  <span class="badge">Role: Admin</span>

  <div class="grid" style="margin-top:30px;">
    <div class="card">
      <h3>👥 Manage Users</h3>
      <p>Sab users ki list aur unke roles manage karein (Firestore console se).</p>
    </div>
    <div class="card">
      <h3>📝 Manage Content</h3>
      <p>Website ka content add/edit/delete karein.</p>
    </div>
    <div class="card">
      <h3>📈 Site Analytics</h3>
      <p>Website ki performance aur users ka data dekhein.</p>
    </div>
  </div>
</div>

<!-- Firebase Script Tags (Compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  const requiredRole = "admin";
</script>
<script src="js/guard.js"></script>

</body>
</html>
