<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard - LearnHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dash-header">
  <h2>LearnHub</h2>
  <button class="btn logout-btn" onclick="handleLogout()">Logout</button>
</div>

<div class="dash-body">
  <h1>Welcome, <span id="welcomeName">User</span> 👋</h1>
  <span class="badge">Role: User</span>

  <div class="grid" style="margin-top:30px;">
    <div class="card">
      <h3>📖 My Courses</h3>
      <p>Aapke enrolled courses aur content yahan dikhega.</p>
    </div>
    <div class="card">
      <h3>📊 My Progress</h3>
      <p>Apni learning progress track karein.</p>
    </div>
    <div class="card">
      <h3>⚙️ Profile Settings</h3>
      <p>Apni profile update karein.</p>
    </div>
  </div>
</div>

<!-- Firebase Script Tags (Compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  const requiredRole = "user";
</script>
<script src="js/guard.js"></script>

</body>
</html>
