<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - LearnHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="logo"><a href="index.html">LearnHub</a></div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="login.html" class="btn-primary">Login</a>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-box">
    <h2>Account Banayein</h2>
    <p class="sub">Kuch second mein signup karein</p>

    <form id="signupForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="Aapka naam">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="Kam az kam 6 characters" minlength="6">
      </div>
      <button type="submit" class="btn">Sign Up</button>
      <p class="error-msg" id="errorMsg"></p>
    </form>

    <div class="divider">ya</div>

    <button class="google-btn" type="button" onclick="handleGoogleLogin()">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="google">
      Google se Sign Up karein
    </button>

    <p class="switch-text">Pehle se account hai? <a href="login.html">Login karein</a></p>
  </div>
</div>

<!-- Firebase Script Tags (Compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
