
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <div class="auth-modal">
        <!-- Header -->
        <div class="modal-header">
            <h2 id="modalTitle">Welcome Back</h2>
            <p id="modalSubtitle">
                Please enter your details to continue
            </p>
        </div>
        <!-- Social Login -->
        <div class="social-buttons">
            <button class="btn-social" type="button" aria-label="Google">
                <!-- tumhara existing Google SVG yahan -->
            </button>
            <button class="btn-social" type="button" aria-label="GitHub">
                <!-- tumhara existing GitHub SVG yahan -->
            </button>
            <button class="btn-social" type="button" aria-label="Facebook">
                <!-- tumhara existing Facebook SVG yahan -->
            </button>
        </div>
        <div class="divider">
            <span>or continue with email</span>
        </div>
        <!-- SIGN IN FORM -->
        <form class="form-content active" id="formSignin">
            <div class="form-group">
                <label for="signin-email">
                    Email Address
                </label>
                <div class="input-wrapper">
                    <input
                        type="email"
                        id="signin-email"
                        placeholder="name@company.com"
                        required
                    >
                </div>
            </div>
            <div class="form-group">
                <label for="signin-password">
                    Password
                </label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="signin-password"
                        class="password-input"
                        placeholder="••••••••"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password">
                        👁️
                    </button>
                </div>
            </div>
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox">
                    Remember me
                </label>
                <a href="#" class="forgot-link">
                    Forgot password?
                </a>
            </div>
            <button
                type="submit"
                class="btn-submit"
                id="signin-btn">
                Sign In
            </button>
        </form>
        <!-- SIGN UP PAGE LINK -->
        <p>
            Don't have an account?
            <a href="/html/signup.html">
                Sign Up
            </a>
        </p>
    </div>


    <script type="module" src="/js/login.js"></script>

</body>

</html>
