<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <div class="auth-modal">

        <!-- Header -->
        <div class="modal-header">

            <h2 id="modalTitle">
                Create Account
            </h2>

            <p id="modalSubtitle">
                Join us to get started with your account
            </p>

        </div>


        <!-- Social Login -->

        <div class="social-buttons">

            <button
                class="btn-social"
                type="button"
                aria-label="Google">

                <!-- existing Google SVG -->

            </button>


            <button
                class="btn-social"
                type="button"
                aria-label="GitHub">

                <!-- existing GitHub SVG -->

            </button>


            <button
                class="btn-social"
                type="button"
                aria-label="Facebook">

                <!-- existing Facebook SVG -->

            </button>

        </div>


        <div class="divider">
            <span>or continue with email</span>
        </div>


        <!-- SIGN UP FORM -->

        <form
            class="form-content active"
            id="formSignup">


            <div class="form-group">

                <label for="signup-name">
                    Full Name
                </label>

                <div class="input-wrapper">

                    <input
                        type="text"
                        id="signup-name"
                        placeholder="John Doe"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="signup-email">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <input
                        type="email"
                        id="signup-email"
                        placeholder="name@company.com"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="signup-password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="signup-password"
                        class="password-input"
                        placeholder="••••••••"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password">

                        👁️

                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="btn-submit"
                id="signup-btn">

                Create Account

            </button>

        </form>


        <!-- LOGIN PAGE LINK -->

        <p>
            Already have an account?
            <a href="/html/login.html">
                Sign In
            </a>
        </p>

    </div>


    <script type="module" src="/js/index.js"></script>

</body>

</html>
