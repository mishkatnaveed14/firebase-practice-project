<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Operations - AuraTech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">AuraTech</a>
    <div id="navLinks" class="nav-links"></div>
  </nav>

  <main class="main-content">
    <div class="card" style="margin-bottom: 2rem;">
      <h2>Add Product to Catalog</h2>
      <form id="addForm" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; margin-top:1rem;">
        <input type="text" id="pName" placeholder="Product Title" required>
        <input type="number" id="pPrice" placeholder="Price ($)" required>
        <select id="pCategory">
          <option value="Keyboards">Keyboards</option>
          <option value="Audio">Audio</option>
          <option value="Displays">Displays</option>
          <option value="Accessories">Accessories</option>
        </select>
        <button type="submit" class="btn">Add Product</button>
      </form>
    </div>

    <h2>Inventory Management</h2>
    <div id="adminList" style="margin-top: 1rem;"></div>
  </main>

  <script type="module" src="auth.js"></script>
  <script type="module">
    import { db, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from './firebase-config.js';

    const addForm = document.getElementById("addForm");
    const adminList = document.getElementById("adminList");

    async function loadAdminProducts() {
      const snap = await getDocs(collection(db, "products"));
      adminList.innerHTML = "";
      snap.forEach(d => {
        const item = d.data();
        adminList.innerHTML += `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <div>
              <strong>${item.name}</strong> ($${item.price}) - <em>${item.category}</em>
            </div>
            <div>
              <button onclick="toggleStock('${d.id}', ${item.stock})" class="btn btn-outline" style="padding:0.3rem 0.6rem;">
                ${item.stock ? 'Set Out of Stock' : 'Set In Stock'}
              </button>
              <button onclick="deleteProduct('${d.id}')" class="btn btn-danger" style="padding:0.3rem 0.6rem;">Delete</button>
            </div>
          </div>
        `;
      });
    }

    addForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      await addDoc(collection(db, "products"), {
        name: document.getElementById("pName").value,
        price: parseFloat(document.getElementById("pPrice").value),
        category: document.getElementById("pCategory").value,
        stock: true
      });
      addForm.reset();
      loadAdminProducts();
    });

    window.deleteProduct = async (id) => {
      await deleteDoc(doc(db, "products", id));
      loadAdminProducts();
    };

    window.toggleStock = async (id, current) => {
      await updateDoc(doc(db, "products", id), { stock: !current });
      loadAdminProducts();
    };

    loadAdminProducts();
  </script>
</body>
</html>
