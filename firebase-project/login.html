<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth Portal - AuraTech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">AuraTech</a>
    <div id="navLinks" class="nav-links"></div>
  </nav>

  <main class="main-content">
    <div class="card" style="max-width: 420px; margin: 3rem auto;">
      <h2 id="formTitle" style="margin-bottom: 1.5rem;">Login</h2>
      
      <div style="margin-bottom: 1rem;" id="nameGroup" hidden>
        <input type="text" id="authName" placeholder="Full Name">
      </div>
      <div style="margin-bottom: 1rem;">
        <input type="email" id="authEmail" placeholder="Email Address" required>
      </div>
      <div style="margin-bottom: 1rem;">
        <input type="password" id="authPassword" placeholder="Password" required>
      </div>
      <div style="margin-bottom: 1rem;" id="roleGroup" hidden>
        <select id="authRole">
          <option value="user">Customer Account</option>
          <option value="admin">Administrator Account</option>
        </select>
      </div>

      <button id="submitAuth" class="btn" style="width: 100%;">Sign In</button>
      
      <p style="margin-top: 1rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
        <span id="toggleText">Need an account?</span> 
        <a href="#" id="toggleAuth" style="color: var(--accent-blue);">Register</a>
      </p>

      <p id="errorMsg" style="color:var(--accent-red); margin-top:0.5rem; font-size:0.85rem;"></p>
    </div>
  </main>

  <script type="module" src="auth.js"></script>
  <script type="module">
    import { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, doc, setDoc } from './firebase-config.js';

    let isRegister = false;
    const toggleAuth = document.getElementById("toggleAuth");
    const nameGroup = document.getElementById("nameGroup");
    const roleGroup = document.getElementById("roleGroup");
    const formTitle = document.getElementById("formTitle");
    const submitAuth = document.getElementById("submitAuth");

    toggleAuth.addEventListener("click", (e) => {
      e.preventDefault();
      isRegister = !isRegister;
      formTitle.innerText = isRegister ? "Create Account" : "Login";
      submitAuth.innerText = isRegister ? "Sign Up" : "Sign In";
      nameGroup.hidden = !isRegister;
      roleGroup.hidden = !isRegister;
    });

    submitAuth.addEventListener("click", async () => {
      const email = document.getElementById("authEmail").value;
      const password = document.getElementById("authPassword").value;
      const name = document.getElementById("authName").value;
      const role = document.getElementById("authRole").value;
      const errorMsg = document.getElementById("errorMsg");

      try {
        if (isRegister) {
          const res = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, "users", res.user.uid), { name, email, role });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        errorMsg.innerText = err.message;
      }
    });
  </script>
</body>
</html>
