<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Tech - Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">AuraTech</a>
    <div id="navLinks" class="nav-links"></div>
  </nav>

  <main class="main-content">
    <div class="card" style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
      <input type="text" id="searchInput" placeholder="Search products..." style="flex:2;">
      <select id="categoryFilter" style="flex:1;">
        <option value="All">All Categories</option>
        <option value="Keyboards">Keyboards</option>
        <option value="Audio">Audio</option>
        <option value="Displays">Displays</option>
        <option value="Accessories">Accessories</option>
      </select>
    </div>

    <div id="productGrid" class="grid-3"></div>
  </main>

  <div id="cartDrawer" class="cart-drawer">
    <h2>Your Cart</h2>
    <div id="cartItems" class="cart-items"></div>
    <div style="border-top:1px solid var(--border-color); padding-top:1rem;">
      <h3>Total: <span id="cartTotal">$0</span></h3>
      <button id="checkoutBtn" class="btn" style="width:100%; margin-top:1rem;">Checkout</button>
      <button onclick="toggleCart()" class="btn btn-outline" style="width:100%; margin-top:0.5rem;">Close</button>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
  <script type="module">
    import { db, collection, getDocs } from './firebase-config.js';

    let products = [];
    let cart = JSON.parse(localStorage.getItem("cart") || "[]");

    window.toggleCart = () => document.getElementById("cartDrawer").classList.toggle("open");

    async function loadProducts() {
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        products = [];
        querySnapshot.forEach((doc) => products.push({ id: doc.id, ...doc.data() }));
      } catch (err) {
        // Fallback Data if Firestore empty
        products = [
          { id: "1", name: "Custom Wireless Keyboard", category: "Keyboards", price: 140, stock: true },
          { id: "2", name: "Ergonomic Mouse", category: "Accessories", price: 85, stock: true },
          { id: "3", name: "4K UHD Display", category: "Displays", price: 450, stock: false }
        ];
      }
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      const search = document.getElementById("searchInput").value.toLowerCase();
      const category = document.getElementById("categoryFilter").value;

      const filtered = products.filter(p => 
        p.name.toLowerCase().includes(search) && (category === "All" || p.category === category)
      );

      grid.innerHTML = filtered.map(p => `
        <div class="card">
          <span style="font-size:0.8rem; color:var(--text-muted);">${p.category}</span>
          <h3 style="margin:0.4rem 0;">${p.name}</h3>
          <p style="font-size:1.2rem; font-weight:bold; color:var(--accent-blue);">$${p.price}</p>
          <p style="color:${p.stock ? 'var(--accent-green)' : 'var(--accent-red)'}; font-size:0.85rem; margin:0.5rem 0;">
            ${p.stock ? 'In Stock' : 'Out of Stock'}
          </p>
          <button onclick="addToCart('${p.id}')" class="btn" style="width:100%;" ${!p.stock ? 'disabled style="opacity:0.5;"' : ''}>
            Add to Cart
          </button>
        </div>
      `).join("");
    }

    window.addToCart = (id) => {
      const item = products.find(p => p.id === id);
      const existing = cart.find(c => c.id === id);
      if (existing) existing.qty += 1;
      else cart.push({ ...item, qty: 1 });
      
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    };

    window.removeFromCart = (id) => {
      cart = cart.filter(c => c.id !== id);
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    };

    function renderCart() {
      const container = document.getElementById("cartItems");
      const totalEl = document.getElementById("cartTotal");
      const countEl = document.getElementById("cartCount");

      container.innerHTML = cart.map(c => `
        <div class="cart-item">
          <div>
            <h4>${c.name}</h4>
            <p style="font-size:0.85rem; color:var(--text-muted);">$${c.price} x ${c.qty}</p>
          </div>
          <button onclick="removeFromCart('${c.id}')" class="btn btn-danger" style="padding:0.2rem 0.5rem;">X</button>
        </div>
      `).join("");

      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const count = cart.reduce((sum, i) => sum + i.qty, 0);
      
      totalEl.innerText = `$${total}`;
      if (countEl) countEl.innerText = count;
    }

    document.getElementById("searchInput").addEventListener("input", renderProducts);
    document.getElementById("categoryFilter").addEventListener("change", renderProducts);
    
    loadProducts();
    renderCart();
  </script>
</body>
</html>
